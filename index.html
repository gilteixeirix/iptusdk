<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>IPTU Chain</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/stellar-sdk/10.4.1/stellar-sdk.min.js"></script>

<style>

body{
  background:#0f172a;
  color:white;
  font-family:Arial;
  padding:20px;
}

.container{
  max-width:700px;
  margin:auto;
  background:#1e293b;
  padding:30px;
  border-radius:20px;
}

.card{
  background:#334155;
  padding:20px;
  border-radius:15px;
  margin-top:20px;
}

input{
  width:100%;
  padding:12px;
  margin-top:10px;
  margin-bottom:10px;
  border:none;
  border-radius:10px;
  background:#0f172a;
  color:white;
}

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:10px;
  margin-top:10px;
  cursor:pointer;
  font-weight:bold;
}

.connect{
  background:#38bdf8;
}

.anchor{
  background:#22c55e;
  color:white;
}

.audit{
  background:#f59e0b;
  color:white;
}

small{
  display:block;
  margin-top:10px;
  word-break:break-all;
}

.success{
  color:#22c55e;
}

.error{
  color:#ef4444;
}

a{
  color:#38bdf8;
}

</style>

</head>

<body>

<div class="container">

<h1>IPTU Chain</h1>

<p>
Auditoria Fiscal Blockchain Stellar
</p>

<button
  class="connect"
  onclick="connectWallet()"
>
Conectar Freighter
</button>

<div class="card">

<strong>Carteira</strong>

<small id="wallet">
Não conectada
</small>

</div>

<div class="card">

<input
  id="matricula"
  placeholder="Matrícula IPTU"
>

<input
  id="valor"
  placeholder="Valor IPTU"
>

<button
  class="anchor"
  onclick="anchorHash()"
>
Gerar SHA-256 + Ancorar
</button>

<div id="status"></div>

</div>

<div class="card">

<input
  id="consultaMatricula"
  placeholder="Matrícula"
>

<input
  id="consultaValor"
  placeholder="Valor Atual"
>

<button
  class="audit"
  onclick="auditHash()"
>
Auditar
</button>

<div id="auditResult"></div>

</div>

</div>

<script src="./main.js"></script>

</body>

</html>
